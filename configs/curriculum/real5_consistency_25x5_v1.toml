[curriculum]
name = "real5_consistency_25x5_v1"
expected_datasets = 5
# Five tasks per dataset and five sibling rollouts per task.
tasks_per_cycle = 25
num_clusters_per_dataset = 10
active_clusters_per_dataset = 5
mini_cluster_size = 8
candidate_count = 8

# A same-task K=5 group is the atomic scheduling and MACE-freeze unit. Five
# task groups may be active, but each group is committed only at its boundary.
task_window = 5
rollout_workers = 5
rollouts_per_task = 5

boundary_eps = 0.17
alpha = 0.3
cooldown_per_dataset = 10
nominal_epoch_cycles = 2
