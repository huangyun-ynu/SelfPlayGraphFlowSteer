[curriculum]
name = "formal_3500"
expected_datasets = 7
tasks_per_cycle = 14
num_clusters_per_dataset = 16
active_clusters_per_dataset = 2
mini_cluster_size = 8
candidate_count = 8

# Two tasks per dataset; dispatch all fourteen groups without serial windows.
# Worker concurrency is an admission ceiling, not a GPU batch size.
task_window = 14
rollout_workers = 64
# Project invariant: keep five sibling graph rollouts per task.
rollouts_per_task = 5

boundary_eps = 0.17
alpha = 0.3
cooldown_per_dataset = 64
# 3584 / 14 = 256 nominal cycles per full-pool epoch.
nominal_epoch_cycles = 256
