[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "selfplay-graph-flowsteer"
version = "0.1.0"
description = "Multi-agent graph self-play with separate Proposer and Solver policies"
readme = "README.md"
license-files = ["NOTICE.md", "third_party/notices/*"]
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23", "numpy>=1.26"]

[project.optional-dependencies]
tracking = ["wandb>=0.25,<0.26"]
openai = ["openai>=1.0"]
selfplay = ["torch>=2.6", "transformers>=5.15,<6"]
train = ["torch>=2.6", "transformers>=5.15,<6", "accelerate>=1.0", "peft>=0.20"]
ads = ["scikit-learn>=1.4"]
alfworld = ["alfworld>=0.4.2", "pyyaml", "textworld[pddl]>=1.6.1"]
webshop = [
    "beautifulsoup4>=4.11",
    "clean-text>=0.6",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "faiss-cpu>=1.8",
    "Flask>=2.1",
    "gym==0.26.2",
    "pyserini==0.17.0",
    "rank-bm25>=0.2.2",
    "selenium>=4.2",
    "spacy>=3.7",
    "thefuzz>=0.19",
    "tqdm>=4.64",
]
serve = ["vllm>=0.27,<0.28"]
dev = ["pytest>=8", "ruff>=0.11"]

[project.scripts]
spgfs = "selfplay_graph_flowsteer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.setuptools.package-data]
selfplay_graph_flowsteer = ["director_seed_v2.json"]
