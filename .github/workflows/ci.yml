name: Offline tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU PyTorch for offline tensor tests
        run: python -m pip install 'torch>=2.6' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,ads,tracking]'
      - run: ruff check src --select F821,F822,F823
      - run: python -m compileall -q src
      - run: pytest -q
      - run: spgfs dry-run-selfplay --mock --num-tasks 2 --rollouts 5 --output state/demo.json
      - run: bash examples/mock_cycle.sh
